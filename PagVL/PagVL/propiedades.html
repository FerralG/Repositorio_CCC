<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.propiedades">Inmobiliaria Vives Lara - Propiedades</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/PagVL/css/main-styles.css">     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><link rel="stylesheet" href="/PagVL/css/tema-elegante.css?v=7">

    
    </head>

<body>

    <header class="header-fijo">
        <div class="header-container">
            
            <div class="header-left-group">
                <a href="/" class="header-logo">
                    <img src="/PagVL/images/LOGO-nofondo-nonombre.png" alt="Inmobiliaria Vives Lara">
                </a>
                <div class="header-socials">
                    <a href="https://www.facebook.com/profile.php?id=100086406399122" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                    <a href="#" aria-label="Email"><i class="fas fa-envelope"></i></a>
                    <a href="https://www.instagram.com/viveslara/" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>
            
            <div class="header-info">
                <nav class="header-nav">
                    <ul>
                        <li><a href="/" data-i18n="nav.inicio">Inicio</a></li>
                        <li><a href="/propiedades" class="active" data-i18n="nav.propiedades">Propiedades</a></li>
                        <li><a href="/#contacto" data-i18n="nav.contacto">Contacto</a></li>
                    </ul>
                </nav>
                <div class="lang-switch" role="group" aria-label="Idioma" data-i18n-aria="idioma.etiqueta">
                    <button type="button" data-lang="es" aria-pressed="true">ES</button>
                    <span aria-hidden="true">|</span>
                    <button type="button" data-lang="en" aria-pressed="false">EN</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="properties-page-layout">
            
            <aside class="sidebar-filters">
                <h3 data-i18n="listado.tipos">Tipos de Propiedad</h3>
                <ul class="filter-list" id="sidebar-filter-list">
                    <li>
                        <label data-i18n="tipo.casa">
                            <input type="checkbox" name="tipo" value="casa">
                            <span class="custom-checkbox"></span> Casa
                        </label>
                    </li>
                    <li>
                        <label data-i18n="tipo.departamento">
                            <input type="checkbox" name="tipo" value="departamento">
                            <span class="custom-checkbox"></span> Departamento
                        </label>
                    </li>
                    <li>
                        <label data-i18n="tipo.terreno">
                            <input type="checkbox" name="tipo" value="terreno">
                            <span class="custom-checkbox"></span> Terreno
                        </label>
                    </li>
                    <li>
                        <label data-i18n="tipo.local">
                            <input type="checkbox" name="tipo" value="local">
                            <span class="custom-checkbox"></span> Local Comercial
                        </label>
                    </li>
                    <li>
                        <label data-i18n="tipo.oficina">
                            <input type="checkbox" name="tipo" value="oficina">
                            <span class="custom-checkbox"></span> Oficina
                        </label>
                    </li>
                    <li>
                        <label data-i18n="tipo.otro">
                            <input type="checkbox" name="tipo" value="otro">
                            <span class="custom-checkbox"></span> Otro
                        </label>
                    </li>
                </ul>
            </aside>

            <div class="main-content-filters">
                
                <div class="top-filter-bar">

                    <div class="search-dropdown-container">
                        <button type="button" class="dropdown-toggle" data-dropdown-id="dropdown-operacion-page" data-i18n="buscador.operacion">
                            Operación (Ambas) <i class="fas fa-chevron-down"></i>
                        </button>
                        <ul class="dropdown-menu" id="dropdown-operacion-page">
                            <li><a href="#" data-value="ambas" data-i18n="buscador.ambas">Ambas (Venta y Renta)</a></li>
                            <li><a href="#" data-value="venta" data-i18n="buscador.venta">Venta</a></li>
                            <li><a href="#" data-value="renta" data-i18n="buscador.renta">Renta</a></li>
                        </ul>
                    </div>
                    
                    
                    <div class="search-dropdown-container">
                        <button type="button" class="dropdown-toggle" data-dropdown-id="dropdown-ubicacion-page" data-i18n="buscador.ubicacion">
                            Ubicación <i class="fas fa-chevron-down"></i>
                        </button>
                        <ul class="dropdown-menu" id="dropdown-ubicacion-page">
                            <li><a href="#" data-value="todas" data-i18n="buscador.ubicacion">Ubicación</a></li> <li><a href="#" data-value="alvarado">Alvarado</a></li>
                            <li><a href="#" data-value="boca-del-rio">Boca del Río</a></li>
                            <li><a href="#" data-value="merida">Mérida</a></li>
                            <li><a href="#" data-value="veracruz">Veracruz</a></li>
                        </ul>
                    </div>
                    
                    <div class="search-dropdown-container">
                        <button type="button" class="dropdown-toggle" data-dropdown-id="dropdown-recamaras-page" data-i18n="buscador.cuartos">
                            Cuartos <i class="fas fa-chevron-down"></i> </button>
                        <ul class="dropdown-menu" id="dropdown-recamaras-page">
                            <li><a href="#" data-value="cualquiera" data-i18n="buscador.cuartos">Cuartos</a></li> <li><a href="#" data-value="1">1</a></li>
                            <li><a href="#" data-value="2">2</a></li>
                            <li><a href="#" data-value="3">3</a></li>
                            <li><a href="#" data-value="4">4</a></li>
                            <li><a href="#" data-value="5+">5+</a></li>
                        </ul>
                    </div>

                    <div class="search-dropdown-container">
                        <button type="button" class="dropdown-toggle" data-dropdown-id="dropdown-precio-page" data-i18n="buscador.maxPrecio">
                            Máx. Precio <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="dropdown-menu slider-dropdown" id="dropdown-precio-page">
                            <label for="price-slider-page" data-i18n="buscador.precio">Precio: <span id="price-value-page">$5,000,000</span></label>
                            <input type="range" id="price-slider-page" min="0" max="15000000" step="250000" value="15000000">
                        </div>
                    </div>
                </div>

                <div class="properties-grid" id="properties-grid-page-container">
                    </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-logo">
                <img src="/PagVL/images/LOGO-nofondo-nombre.png" alt="Inmobiliaria Vives Lara">
                <a href="/aviso-de-privacidad" data-i18n="pie.privacidad">Aviso de privacidad</a>
            </div>
            <div class="footer-contacto">
                <a href="/#contacto" data-i18n="pie.contactanos">Contáctanos</a>
            </div>
            <div class="footer-copy">
                <p data-i18n="pie.derechos">© Inmobiliaria Vives Lara - derechos reservados</p>
            </div>
        </div>
    </footer>

    <script src="/PagVL/js/i18n.js?v=3"></script>
    <script src="/PagVL/js/main.js"></script>
</body>
</html>
